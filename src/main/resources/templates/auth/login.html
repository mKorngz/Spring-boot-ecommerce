<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MK Commerce | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body>
<!-- Background Glow Circles -->
<div class="bg-circle circle-1"></div>
<div class="bg-circle circle-2"></div>
<div class="bg-circle circle-3"></div>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo-wrapper">

            <img
                    th:src="@{/images/logo.jpg}"
                    alt="MK Commerce"
                    class="logo">

        </div>

        <h1 class="app-title">
            Welcome Back
        </h1>

        <p class="subtitle">
            Sign in to continue to MK Commerce
        </p>

        <form id="loginForm">

            <div class="mb-3">

                <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Email Address"
                        required>

            </div>

            <div class="mb-3">

                <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Password"
                        required>

            </div>

            <div id="errorMessage"
                 class="alert alert-danger d-none">
            </div>

            <button
                    type="submit"
                    class="btn-login">

                SIGN IN

            </button>

        </form>

        <div class="auth-footer">

            <span>Don't have an account?</span>

            <a th:href="@{/register}">
                Create Account
            </a>

        </div>

    </div>

</div>
<script th:src="@{/js/login.js}"></script>
</body>

</html>
