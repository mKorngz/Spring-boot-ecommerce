<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <th:block
                th:replace="~{fragments/sidebar :: sidebar('orders')}">
        </th:block>
        <!-- Content -->

        <div class="col-lg-10">

            <div class="main-content p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h1>
                            🛒 Orders
                        </h1>

                        <p class="text-secondary">
                            Manage customer orders.
                        </p>

                    </div>

                    <div></div>

                </div>

                <div class="recent-orders">

                    <table class="table orders-table">

                        <thead>

                        <tr>

                            <th>Order #</th>

                            <th>User ID</th>

                            <th>Total Amount</th>

                            <th>Status</th>

                            <th>Created At</th>

                            <th>Actions</th>

                        </tr>

                        </thead>

                        <tbody id="orderTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<div class="modal fade"
     id="orderModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    🛒 Order Details
                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">

                    <span class="order-label">
                        Order Number:
                    </span>
                    <span
                            class="order-value"
                            id="orderNumber">
                    </span>

                </div>

                <div class="mb-3">

                    <span class="order-label">
                        User ID:
                    </span>

                    <span
                            class="order-value"
                            id="orderUserId">
                    </span>

                </div>

                <div class="mb-3">

                    <span class="order-label">
                        Customer:
                    </span>

                    <span
                            class="order-value"
                            id="orderCustomer">
                    </span>

                </div>

                <div class="mb-3">

                    <span class="order-label">
                        Email:
                    </span>

                    <span
                            class="order-value"
                            id="orderEmail">
                    </span>

                </div>

                <div class="mb-3">

                    <strong>Total Amount:</strong>

                    $<span id="orderTotal"></span>

                </div>

                <div class="mb-3">

    <span class="order-label">
        Status:
    </span>

                    <span
                            class="order-value"
                            id="orderStatus">
    </span>

                </div>

                <div class="mb-3">

                    <label
                            class="form-label">

                        Update Status

                    </label>

                    <select
                            id="statusSelect"
                            class="form-select">

                        <option value="PENDING">
                            PENDING
                        </option>

                        <option value="CONFIRMED">
                            CONFIRMED
                        </option>

                        <option value="COMPLETED">
                            COMPLETED
                        </option>

                        <option value="CANCELLED">
                            CANCELLED
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <button
                            class="hero-btn"
                            onclick="updateOrderStatus()">

                        Update Status

                    </button>

                </div>

                <hr>

                <h6>Order Items</h6>

                <table class="table orders-table">

                    <thead>

                    <tr>

                        <th>Product</th>

                        <th>Price</th>

                        <th>Qty</th>

                        <th>Subtotal</th>

                    </tr>

                    </thead>

                    <tbody id="orderItemsBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
<script th:src="@{/js/auth-guard.js}"></script>
<script th:src="@{/js/orders.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
