<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MK Commerce Dashboard</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <th:block
                th:replace="~{fragments/sidebar :: sidebar('dashboard')}">
        </th:block>

        <!-- Main Content -->
        <div class="col-lg-10">

            <div class="main-content p-4">

                <!-- Hero Banner -->
                <div class="hero-card">
                    <div>
                        <h1>
                            👋 Welcome Back,
                            <span id="adminNameBanner">Admin</span>
                        </h1>
                        <p>
                            Manage products, orders and customers from one central dashboard.
                        </p>
                        <div class="hero-actions">
                            <button class="hero-btn">
                                <i class="bi bi-plus-lg me-1"></i> Add Product
                            </button>
                            <button class="hero-btn secondary">
                                <i class="bi bi-box-seam me-1"></i> View Orders
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Stat Cards: Properly placed in main content and set to 5 columns -->
                <div class="row row-cols-1 row-cols-md-3 row-cols-xl-5 g-3 mb-4">

                    <div class="col">
                        <div class="stat-card">
                            <div class="card-icon icon-blue"><i class="bi bi-people"></i></div>
                            <h6>Total Users</h6>
                            <h2 id="totalUsers">0</h2>
                        </div>
                    </div>

                    <div class="col">
                        <div class="stat-card">
                            <div class="card-icon icon-purple"><i class="bi bi-box-seam"></i></div>
                            <h6>Products</h6>
                            <h2 id="totalProducts">0</h2>
                        </div>
                    </div>

                    <div class="col">
                        <div class="stat-card">
                            <div class="card-icon icon-cyan"><i class="bi bi-cart3"></i></div>
                            <h6>Orders</h6>
                            <h2 id="totalOrders">0</h2>
                        </div>
                    </div>

                    <div class="col">
                        <div class="stat-card">
                            <div class="card-icon icon-green"><i class="bi bi-currency-dollar"></i></div>
                            <h6>Revenue</h6>
                            <h2 id="totalRevenue">$0</h2>
                        </div>
                    </div>

                    <div class="col">
                        <div class="stat-card">
                            <div class="card-icon icon-amber"><i class="bi bi-hourglass-split"></i></div>
                            <h6>Pending Orders</h6>
                            <h2 id="pendingOrders">0</h2>
                        </div>
                    </div>

                </div>

                <!-- Recent Orders Table Section -->
                <div class="recent-orders">

                    <div class="section-header">
                        <h3>
                            <i class="bi bi-clipboard-data me-2"></i> Recent Orders
                        </h3>
                        <span>Latest Activity</span>
                    </div>

                    <div class="table-responsive">
                        <table class="table orders-table">
                            <thead>
                            <tr>
                                <th>Order</th>
                                <th>Customer</th>
                                <th>Total</th>
                                <th>Status</th>
                            </tr>
                            </thead>
                            <tbody id="recentOrdersBody">
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<script th:src="@{/js/auth-guard.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>

</body>

</html>
