<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>MK Commerce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/shop.css}">

</head>

<body>

<th:block
        th:replace="~{fragments/customer-navbar :: customerNavbar}">
</th:block>

<div class="container py-5">

    <div class="mb-4">

        <h1>
            Explore Products
        </h1>

        <p class="text-secondary">
            Find products and start shopping.
        </p>

    </div>

    <input
            type="text"
            id="searchInput"
            class="form-control search-box"
            placeholder="Search products...">

    <div
            id="categoryContainer"
            class="my-4 d-flex flex-wrap gap-2">

    </div>

    <div
            id="productContainer"
            class="row g-4">

    </div>

</div>

<script th:src="@{/js/shop.js}"></script>

</body>

</html>
